apiVersion: v1
kind: Secret
metadata:
  name: gmao-secrets
  namespace: gmao
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "<CHANGE_ME_DB_USERNAME>"
  SPRING_DATASOURCE_PASSWORD: "<CHANGE_ME_DB_PASSWORD>"
  APP_JWT_SECRET: "<CHANGE_ME_JWT_SECRET>"
  MYSQL_ROOT_PASSWORD: "<CHANGE_ME_MYSQL_ROOT_PASSWORD>"
  MYSQL_DATABASE: "gmao"
  MYSQL_USER: "<CHANGE_ME_MYSQL_USER>"
  MYSQL_PASSWORD: "<CHANGE_ME_MYSQL_PASSWORD>"
  GF_SECURITY_ADMIN_USER: "admin"
  GF_SECURITY_ADMIN_PASSWORD: "<CHANGE_ME_GRAFANA_PASSWORD>"
