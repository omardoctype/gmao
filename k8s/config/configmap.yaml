apiVersion: v1
kind: ConfigMap
metadata:
  name: gmao-config
  namespace: gmao
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"
  APP_CORS_ALLOWED_ORIGINS: "https://gmao.example.com"
  APP_AI_SERVICE_BASE_URL: "http://ai-service:8000"
  APP_DOCUMENTS_STORAGE_DIR: "/app/uploads/equipment-documents"
  AI_PROVIDER: "ollama"
  OLLAMA_BASE_URL: "http://ollama:11434"
  OLLAMA_MODEL: "qwen2.5:1.5b"
  DOCUMENTS_DIR: "/app/documents"
  SOURCE_DOCUMENTS_DIR: "/app/documents"
  CHROMA_DIR: "/app/chroma_db"
  FRONTEND_API_BASE_URL: "/api"
