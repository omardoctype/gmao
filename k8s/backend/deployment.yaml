apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: gmao
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: wait-for-mysql
          image: mysql:8.4
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gmao-secrets
                  key: MYSQL_ROOT_PASSWORD
          command:
            - /bin/sh
            - -c
            - |
              until MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqladmin ping -h mysql -uroot --silent; do
                echo "Waiting for MySQL to be ready..."
                sleep 5
              done
      containers:
        - name: backend
          image: ghcr.io/omardoctype/gmao-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: gmao-config
            - secretRef:
                name: gmao-secrets
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/gmao?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
            - name: APP_AI_SERVICE_BASE_URL
              value: http://ai-service:8000
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: backend-uploads-pvc
