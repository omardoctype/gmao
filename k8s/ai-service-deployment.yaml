apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: gmao
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: gmao-ai-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: AI_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: gmao-config
                  key: AI_PROVIDER
            # ai-service code expects OLLAMA_URL; we map it from OLLAMA_BASE_URL.
            # In-cluster Ollama: http://ollama:11434
            # External Ollama: replace OLLAMA_BASE_URL in ConfigMap.
            - name: OLLAMA_URL
              valueFrom:
                configMapKeyRef:
                  name: gmao-config
                  key: OLLAMA_BASE_URL
            - name: OLLAMA_MODEL
              valueFrom:
                configMapKeyRef:
                  name: gmao-config
                  key: OLLAMA_MODEL
            - name: CHROMA_DIR
              value: /app/chroma_db
          volumeMounts:
            - name: ai-service-data
              mountPath: /app/chroma_db
          resources:
            requests:
              cpu: 300m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: ai-service-data
          persistentVolumeClaim:
            claimName: ai-service-data-pvc

