name: GMAO CI/CD

on:
  push:
    branches:
      - main
      - develop
      - "devops/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: gmao-ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/omardoctype/gmao-backend
  FRONTEND_IMAGE: ghcr.io/omardoctype/gmao-frontend
  AI_SERVICE_IMAGE: ghcr.io/omardoctype/gmao-ai-service

jobs:
  backend:
    name: Backend - build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test backend
        run: mvn -B -ntp test

      - name: Package backend
        run: mvn -B -ntp -DskipTests package

  frontend:
    name: Frontend - build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

  ai-service:
    name: AI Service - dependency and syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: ai-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall app

  docker-build:
    name: Docker - build images and compose config
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - backend
      - frontend
      - ai-service
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Build backend image
        run: docker build -t "${BACKEND_IMAGE}:ci" -f Dockerfile .

      - name: Build frontend image
        run: docker build -t "${FRONTEND_IMAGE}:ci" -f frontend/Dockerfile frontend

      - name: Build ai-service image
        run: docker build -t "${AI_SERVICE_IMAGE}:ci" -f ai-service/Dockerfile ai-service

      - name: Build compose stack
        run: docker compose build

  helm-k8s-validate:
    name: Kubernetes and Helm - template validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - docker-build
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Helm lint
        run: helm lint helm/gmao

      - name: Helm template
        run: |
          if [ -f helm/gmao/values-dev.yaml ]; then
            helm template gmao helm/gmao --namespace gmao --values helm/gmao/values-dev.yaml > /tmp/gmao-rendered.yaml
          else
            helm template gmao helm/gmao --namespace gmao > /tmp/gmao-rendered.yaml
          fi
          test -s /tmp/gmao-rendered.yaml

      - name: Kubernetes YAML presence check
        run: |
          test -d k8s
          find k8s -name "*.yaml" -o -name "*.yml"

  publish-images:
    name: Publish images to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - helm-k8s-validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Publish frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Publish ai-service
        uses: docker/build-push-action@v6
        with:
          context: ai-service
          file: ai-service/Dockerfile
          push: true
          tags: |
            ${{ env.AI_SERVICE_IMAGE }}:latest
            ${{ env.AI_SERVICE_IMAGE }}:${{ github.sha }}

  summary:
    name: CI/CD summary
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - ai-service
      - docker-build
      - helm-k8s-validate
    if: always()
    defaults:
      run:
        shell: bash

    steps:
      - name: Verify global status
        run: |
          echo "Backend job: ${{ needs.backend.result }}"
          echo "Frontend job: ${{ needs.frontend.result }}"
          echo "AI service job: ${{ needs['ai-service'].result }}"
          echo "Docker build job: ${{ needs['docker-build'].result }}"
          echo "Helm/K8s validation job: ${{ needs['helm-k8s-validate'].result }}"
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.frontend.result }}" = "success"
          test "${{ needs['ai-service'].result }}" = "success"
          test "${{ needs['docker-build'].result }}" = "success"
          test "${{ needs['helm-k8s-validate'].result }}" = "success"
