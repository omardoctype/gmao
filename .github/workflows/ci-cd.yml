name: GMAO CI/CD

on:
  push:
    branches:
      - main
      - develop
      - "devops/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish Docker images to GHCR"
        required: false
        default: false
        type: boolean

concurrency:
  group: gmao-ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/omardoctype/gmao-backend
  FRONTEND_IMAGE: ghcr.io/omardoctype/gmao-frontend
  AI_SERVICE_IMAGE: ghcr.io/omardoctype/gmao-ai-service

jobs:
  backend:
    name: Backend - build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test backend
        run: mvn -B -ntp test

      - name: Package backend
        run: mvn -B -ntp -DskipTests package

  frontend:
    name: Frontend - build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

  ai-service:
    name: AI Service - dependency and syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: ai-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall app

  compose-validation:
    name: Docker Compose - static validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - backend
      - frontend
      - ai-service
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Validate Docker Compose quietly
        run: docker compose config --quiet

      - name: Render Docker Compose configuration
        run: docker compose config

  docker-build-frontend:
    name: Docker image - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - frontend
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Disk usage before build
        run: |
          df -h
          docker system df

      - name: Build frontend image
        run: docker build -t gmao-frontend:ci -f frontend/Dockerfile frontend

      - name: Inspect frontend image
        run: |
          docker image inspect gmao-frontend:ci
          docker images gmao-frontend:ci

      - name: Cleanup frontend image and builder cache
        if: always()
        run: |
          docker rmi gmao-frontend:ci || true
          docker builder prune -af || true
          docker system df || true

  docker-build-backend:
    name: Docker image - backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - backend
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Disk usage before build
        run: |
          df -h
          docker system df

      - name: Build backend image
        run: docker build -t gmao-backend:ci -f Dockerfile .

      - name: Inspect backend image
        run: |
          docker image inspect gmao-backend:ci
          docker images gmao-backend:ci

      - name: Cleanup backend image and builder cache
        if: always()
        run: |
          docker rmi gmao-backend:ci || true
          docker builder prune -af || true
          docker system df || true

  docker-build-ai-service:
    name: Docker image - ai-service
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs:
      - ai-service
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Disk usage before build
        run: |
          df -h
          docker system df

      - name: Build ai-service image
        run: docker build -t gmao-ai-service:ci -f ai-service/Dockerfile ai-service

      - name: Inspect ai-service image
        run: |
          docker image inspect gmao-ai-service:ci
          docker images gmao-ai-service:ci

      - name: Cleanup ai-service image and builder cache
        if: always()
        run: |
          docker rmi gmao-ai-service:ci || true
          docker builder prune -af || true
          docker system df || true

  helm-k8s-validate:
    name: Kubernetes and Helm - static validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - backend
      - frontend
      - ai-service
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.2.1

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.34.1

      - name: Helm lint
        run: helm lint helm/gmao

      - name: Helm template values-dev
        run: |
          helm template gmao helm/gmao --namespace gmao --values helm/gmao/values-dev.yaml --debug > /tmp/gmao-rendered.yaml
          test -s /tmp/gmao-rendered.yaml
          wc -l /tmp/gmao-rendered.yaml

      - name: Kustomize render
        run: |
          kubectl kustomize k8s > /tmp/gmao-kustomize.yaml
          test -s /tmp/gmao-kustomize.yaml
          wc -l /tmp/gmao-kustomize.yaml

  publish-images:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs:
      - compose-validation
      - docker-build-frontend
      - docker-build-backend
      - docker-build-ai-service
      - helm-k8s-validate
    if: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            image: ghcr.io/omardoctype/gmao-frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - name: backend
            image: ghcr.io/omardoctype/gmao-backend
            context: .
            dockerfile: Dockerfile
          - name: ai-service
            image: ghcr.io/omardoctype/gmao-ai-service
            context: ai-service
            dockerfile: ai-service/Dockerfile
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }}
        run: |
          set -euo pipefail
          TAG_ARGS=(-t "${{ matrix.image }}:${GITHUB_SHA}")
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAG_ARGS+=(-t "${{ matrix.image }}:latest")
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_ARGS+=(-t "${{ matrix.image }}:${GITHUB_REF_NAME}")
          fi
          docker build "${TAG_ARGS[@]}" -f "${{ matrix.dockerfile }}" "${{ matrix.context }}"
          for ((i=1; i<${#TAG_ARGS[@]}; i+=2)); do
            docker push "${TAG_ARGS[$i]}"
          done

      - name: Cleanup publish runner
        if: always()
        run: |
          docker builder prune -af || true
          docker system df || true

  summary:
    name: CI/CD summary
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - ai-service
      - compose-validation
      - docker-build-frontend
      - docker-build-backend
      - docker-build-ai-service
      - helm-k8s-validate
      - publish-images
    if: always()
    defaults:
      run:
        shell: bash

    steps:
      - name: Verify global status
        run: |
          set -euo pipefail
          echo "Backend validation: ${{ needs.backend.result }}"
          echo "Frontend validation: ${{ needs.frontend.result }}"
          echo "AI service validation: ${{ needs['ai-service'].result }}"
          echo "Compose validation: ${{ needs['compose-validation'].result }}"
          echo "Frontend Docker image: ${{ needs['docker-build-frontend'].result }}"
          echo "Backend Docker image: ${{ needs['docker-build-backend'].result }}"
          echo "AI service Docker image: ${{ needs['docker-build-ai-service'].result }}"
          echo "Kubernetes/Helm static validation: ${{ needs['helm-k8s-validate'].result }}"
          echo "GHCR publication: ${{ needs['publish-images'].result }}"

          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.frontend.result }}" = "success"
          test "${{ needs['ai-service'].result }}" = "success"
          test "${{ needs['compose-validation'].result }}" = "success"
          test "${{ needs['docker-build-frontend'].result }}" = "success"
          test "${{ needs['docker-build-backend'].result }}" = "success"
          test "${{ needs['docker-build-ai-service'].result }}" = "success"
          test "${{ needs['helm-k8s-validate'].result }}" = "success"

          case "${{ needs['publish-images'].result }}" in
            success)
              echo "GHCR publication passed."
              ;;
            skipped)
              echo "GHCR publication skipped: limited to main, tags, or manual workflow_dispatch publish=true."
              ;;
            *)
              echo "GHCR publication failed or was cancelled."
              exit 1
              ;;
          esac
