spring.datasource.url=jdbc:h2:mem:gmao-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=test-secret-key-for-jwt-minimum-length
app.jwt.expiration-ms=86400000
app.seed.admin.enabled=false
app.seed.demo.enabled=false
spring.task.scheduling.enabled=false
