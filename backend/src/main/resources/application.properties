# ----------------------------------------
# Server
# ----------------------------------------
server.port=${SERVER_PORT:8080}

# ----------------------------------------
# Spring application
# ----------------------------------------
spring.application.name=gmao-backend

# ----------------------------------------
# MySQL datasource
# ----------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/gmao?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------
# JPA / Hibernate
# ----------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# SQL logs can be re-enabled locally with environment variables.
logging.level.org.hibernate.SQL=${LOGGING_LEVEL_ORG_HIBERNATE_SQL:WARN}
logging.level.org.hibernate.orm.jdbc.bind=${LOGGING_LEVEL_ORG_HIBERNATE_ORM_JDBC_BIND:WARN}

# ----------------------------------------
# OpenAPI / Swagger
# ----------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ----------------------------------------
# CORS (frontend local development)
# ----------------------------------------
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ----------------------------------------
# JWT
# ----------------------------------------
app.jwt.secret=${APP_JWT_SECRET:change-this-secret-key-in-production}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# ----------------------------------------
# Initial data seeding (roles + admin test user)
# ----------------------------------------
app.seed.admin.enabled=${APP_SEED_ADMIN_ENABLED:true}
app.seed.admin.first-name=${APP_SEED_ADMIN_FIRST_NAME:Admin}
app.seed.admin.last-name=${APP_SEED_ADMIN_LAST_NAME:System}
app.seed.admin.email=${APP_SEED_ADMIN_EMAIL:admin@gmao.com}
app.seed.admin.password=${APP_SEED_ADMIN_PASSWORD:Admin123!}
app.seed.admin.active=${APP_SEED_ADMIN_ACTIVE:true}
app.seed.demo.enabled=${APP_SEED_DEMO_ENABLED:true}

# ----------------------------------------
# Scheduler (maintenance plans -> work orders)
# ----------------------------------------
app.scheduler.maintenance-plan.fixed-delay-ms=${APP_SCHEDULER_MAINTENANCE_PLAN_FIXED_DELAY_MS:60000}
app.scheduler.maintenance-plan.initial-delay-ms=${APP_SCHEDULER_MAINTENANCE_PLAN_INITIAL_DELAY_MS:15000}
app.scheduler.notifications.overdue-work-orders.fixed-delay-ms=${APP_SCHEDULER_NOTIFICATIONS_OVERDUE_WORK_ORDERS_FIXED_DELAY_MS:60000}
app.scheduler.notifications.overdue-work-orders.initial-delay-ms=${APP_SCHEDULER_NOTIFICATIONS_OVERDUE_WORK_ORDERS_INITIAL_DELAY_MS:20000}

# ----------------------------------------
# AI service (FastAPI)
# ----------------------------------------
app.ai-service.base-url=${APP_AI_SERVICE_BASE_URL:http://127.0.0.1:8000}
app.ai-service.connect-timeout-ms=${APP_AI_SERVICE_CONNECT_TIMEOUT_MS:3000}
app.ai-service.read-timeout-ms=${APP_AI_SERVICE_READ_TIMEOUT_MS:120000}

# ----------------------------------------
# Equipment documents storage
# ----------------------------------------
app.documents.storage-dir=${APP_DOCUMENTS_STORAGE_DIR:uploads/equipment-documents}
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:50MB}

# ----------------------------------------
# Actuator / Prometheus
# ----------------------------------------
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}
