namespace:
  create: true
  name: gmao

config:
  appCorsAllowedOrigins: "http://localhost:5173,http://127.0.0.1:5173,http://gmao.local"
  ollamaBaseUrl: "http://host.docker.internal:11434"
  frontendApiBaseUrl: "/api"

backend:
  replicas: 1
  image:
    repository: gmao-backend
    tag: dev
    pullPolicy: IfNotPresent

frontend:
  replicas: 1
  image:
    repository: gmao-frontend
    tag: dev
    pullPolicy: IfNotPresent

aiService:
  replicas: 1
  image:
    repository: gmao-ai-service
    tag: dev
    pullPolicy: IfNotPresent

secrets:
  create: true
  springDatasourceUsername: "<CHANGE_ME_DB_USERNAME>"
  springDatasourcePassword: "<CHANGE_ME_DB_PASSWORD>"
  appJwtSecret: "<CHANGE_ME_JWT_SECRET>"
  mysqlRootPassword: "<CHANGE_ME_MYSQL_ROOT_PASSWORD>"
  mysqlDatabase: "gmao"
  mysqlUser: "<CHANGE_ME_MYSQL_USER>"
  mysqlPassword: "<CHANGE_ME_MYSQL_PASSWORD>"
  grafanaAdminUser: "admin"
  grafanaAdminPassword: "<CHANGE_ME_GRAFANA_PASSWORD>"
