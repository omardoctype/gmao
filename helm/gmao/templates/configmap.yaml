apiVersion: v1
kind: ConfigMap
metadata:
  name: gmao-config
  namespace: {{ .Release.Namespace }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.config.springProfilesActive | quote }}
  SERVER_PORT: {{ .Values.config.serverPort | quote }}
  APP_CORS_ALLOWED_ORIGINS: {{ .Values.config.appCorsAllowedOrigins | quote }}
  APP_AI_SERVICE_BASE_URL: {{ .Values.config.appAiServiceBaseUrl | quote }}
  AI_PROVIDER: {{ .Values.config.aiProvider | quote }}
  OLLAMA_BASE_URL: {{ .Values.config.ollamaBaseUrl | quote }}
  OLLAMA_MODEL: {{ .Values.config.ollamaModel | quote }}
  FRONTEND_API_BASE_URL: {{ .Values.config.frontendApiBaseUrl | quote }}

