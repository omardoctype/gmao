services:
  mysql:
    image: mysql:8.4
    container_name: gmao-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gmao_root_password_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gmao}
      MYSQL_USER: ${MYSQL_USER:-gmao_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gmao_password_change_me}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - gmao-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    image: gmao-ai-service:local
    container_name: gmao-ai-service
    restart: unless-stopped
    environment:
      SERVICE_NAME: gmao-ai-service
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      DOCUMENTS_DIR: /app/documents
      SOURCE_DOCUMENTS_DIR: /app/documents
      CHROMA_DIR: /app/chroma_db
      AUTO_SYNC_DOCUMENTS: ${AUTO_SYNC_DOCUMENTS:-false}
      AI_FAST_MODE: ${AI_FAST_MODE:-true}
      AI_NUM_PREDICT_FAST: ${AI_NUM_PREDICT_FAST:-80}
      AI_NUM_PREDICT_DEFAULT: ${AI_NUM_PREDICT_DEFAULT:-120}
      AI_MAX_CHUNK_CHARS: ${AI_MAX_CHUNK_CHARS:-500}
      AI_TOP_K: ${AI_TOP_K:-3}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.2}
      OLLAMA_TOP_P: ${OLLAMA_TOP_P:-0.9}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service/documents:/app/documents
      - ./ai-service/chroma_db:/app/chroma_db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\""]
      interval: 15s
      timeout: 8s
      retries: 15
      start_period: 30s
    networks:
      - gmao-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: gmao-backend:local
    container_name: gmao-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-gmao}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-gmao_app}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-gmao_password_change_me}
      APP_AI_SERVICE_BASE_URL: http://ai-service:8000
      APP_DOCUMENTS_STORAGE_DIR: /app/uploads/equipment-documents
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-this-dev-secret-before-production-please}
      APP_JWT_EXPIRATION_MS: ${APP_JWT_EXPIRATION_MS:-86400000}
      APP_SEED_ADMIN_ENABLED: ${APP_SEED_ADMIN_ENABLED:-true}
      APP_SEED_DEMO_ENABLED: ${APP_SEED_DEMO_ENABLED:-true}
    ports:
      - "8080:8080"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 45s
    networks:
      - gmao-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    image: gmao-frontend:local
    container_name: gmao-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 25s
    networks:
      - gmao-network

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: gmao-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - gmao-network

  grafana:
    image: grafana/grafana:11.3.1
    container_name: gmao-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-gmao_grafana_change_me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - gmao-network

  ollama:
    image: ollama/ollama:latest
    container_name: gmao-ollama
    restart: unless-stopped
    profiles:
      - ollama-container
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - gmao-network

  ollama-pull:
    image: ollama/ollama:latest
    container_name: gmao-ollama-pull
    restart: "no"
    profiles:
      - ollama-container
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: "ollama pull ${OLLAMA_MODEL:-qwen2.5:1.5b}"
    networks:
      - gmao-network

networks:
  gmao-network:
    driver: bridge

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  ollama_data:
